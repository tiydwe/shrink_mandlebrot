<!DOCTYPE html>
<html>

<head>
  <title>Mandelbrot viewer</title>
</head>

<body>
  <button onclick="reset()">Reset zoom</button><br>
  <small>Click + drag to pan, scroll to zoom</small><br>
  <div>
    <label for=psli>Precision: </label>
    <input type=range id=psli min=10 max=200 value=120><br>
    <p><span id="pval">120</span> iterations</p>
  </div><br>
  <canvas id="mc" width=600 height=500 style="border: 3px solid black;"></canvas><br>
  <small><a href="https://github.com/tiydwe/shrink_mandlebrot">Github Repo</a></small>
  <script>
    let p = [-1.9, 0.5];
    let q = [-1, 1];
    function reset() {
      p = [-1.9, 0.5];
      q = [-1, 1];
      draw(p[0], p[1], q[0], q[1]);
    }
    function hslToRgb(h, s, l) {
      s /= 100;
      l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
    }
    const canvas = document.getElementById('mc');
    const ctx = canvas.getContext('2d');
    let MAX_IT = 120;
    function draw(xmin, xmax, ymin, ymax) {
      let WIDTH = canvas.width, HEIGHT = canvas.height;
      let imdata = ctx.createImageData(Math.floor(WIDTH), Math.floor(HEIGHT));
      let data = imdata.data;
      for (let i = 0; i < HEIGHT; ++i) {
        for (let j = 0; j < WIDTH; ++j) {
          const currpt = [xmin + j / WIDTH * (xmax - xmin), ymin + i / HEIGHT * (ymax - ymin)];
          let zpt = [0, 0];
          let valid = true;
          let endk = -1;
          for (let k = 0; k < MAX_IT; ++k) {
            zpt = [zpt[0] * zpt[0] - zpt[1] * zpt[1] + currpt[0], 2 * zpt[0] * zpt[1] + currpt[1]];
            if (zpt[0] * zpt[0] + zpt[1] * zpt[1] > 1e6) {
              valid = false;
              endk = k;
              break;
            }
          }
          let idx = (i * WIDTH + j) * 4;
          if (valid) {
            data[idx] = 0;
            data[idx + 1] = 0;
            data[idx + 2] = 0;
            data[idx + 3] = 255;
          }
          else {
            const smooth = Math.log(Math.log(zpt[0] * zpt[0] + zpt[1] * zpt[1]) / 2 / Math.log(2.0)) / Math.log(2.0);
            const color = hslToRgb((endk + 1 - smooth) / MAX_IT * 360, 100, 50);
            data[idx] = color[0];
            data[idx + 1] = color[1];
            data[idx + 2] = color[2];
            data[idx + 3] = 255;
          }
        }
      }
      ctx.putImageData(imdata, 0, 0);
    }
    draw(p[0], p[1], q[0], q[1]);
    function getMousePos(evt) {
      var rect = canvas.getBoundingClientRect();
      return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
      };
    }
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const pos = [e.clientX - r.left, e.clientY - r.top];
      const scrollamt = 1 + e.deltaY / 1000;
      const truepos = [pos[0] / r.width * (p[1] - p[0]), pos[1] / r.height * (q[1] - q[0])];
      p = [p[0] + truepos[0] - truepos[0] * scrollamt,
      p[0] + truepos[0] + (p[1] - p[0]) * scrollamt - truepos[0] * scrollamt];
      q = [q[0] + truepos[1] - truepos[1] * scrollamt,
      q[0] + truepos[1] + (q[1] - q[0]) * scrollamt - truepos[1] * scrollamt];
      draw(p[0], p[1], q[0], q[1]);
    }, { passive: false });
    let isdrag = false;
    let lastpos = { x: 0.0, y: 0.0 };
    canvas.addEventListener('mousedown', function (e) {
      isdrag = true;
      lastpos = getMousePos(e);
    });
    canvas.addEventListener('mousemove', function (e) {
      if (isdrag) {
        const mouse = getMousePos(e);
        p = [p[0] - (mouse.x - lastpos.x) / canvas.width * (p[1] - p[0]), p[1] - (mouse.x - lastpos.x) / canvas.width * (p[1] - p[0])];
        q = [q[0] - (mouse.y - lastpos.y) / canvas.height * (q[1] - q[0]), q[1] - (mouse.y - lastpos.y) / canvas.height * (q[1] - q[0])];
        lastpos = mouse;
        draw(p[0], p[1], q[0], q[1]);
      }
    })
    canvas.addEventListener('mouseup', () => { isdrag = false });
    canvas.addEventListener('mouseleave', () => { isdrag = false });

    document.getElementById("psli").addEventListener('input', function () {
      document.getElementById("pval").textContent = this.value;
      MAX_IT = this.value;
      draw(p[0], p[1], q[0], q[1]);
    })
  </script>
</body>

</html>
